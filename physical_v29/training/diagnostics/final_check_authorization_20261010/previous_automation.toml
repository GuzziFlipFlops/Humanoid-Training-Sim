obe. Sparse newer 10 Hz cap crossings cannot inherit older actor-specific driving/braking attribution. A high-speed plateau needs actual CAD motor speeds, requested/applied torque, available torque and sustained driving saturation before a limit claim. Only fully qualified 5 m/s, or qualified 4 m/s with causal native limits blocking 5, all unchanged gates and 32 individually seeded states per command, ends training and this same five-hour heartbeat.\n\nKeep the same ACTIVE five-hour heartbeat, thread, notification preference and verified 5 m/s or qualified 4 m/s plus causal native-limit endpoint. At that endpoint save, pause both, prevent restart and brief with the computer on. Preserve the complete learned state, forward head, both teachers, existing upper 20 batches, 35/1 gains, native caps, truthful 400/23 inference and iteration 4. Fusion stays closed; queued work and videos are preserved."
