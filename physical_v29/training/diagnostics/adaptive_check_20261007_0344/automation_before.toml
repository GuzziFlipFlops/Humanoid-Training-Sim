econds, two impacts out of 87 touches versus zero in control. Do not relax that gate.\n\nThe same supervisor resumed after a 167.4-second pause including 60 seconds of worker drain. Main block 402 completed 65 genuine updates at 6144 environments with exact actor/critic/Adam/exploration, zero pre-update KL and command mismatch,20 upper auxiliary batches per update and stable memory. Twelve diagnostic validation checks pass. The premature before-drain harness and stopped CPU accounting failures are retained. Through saved 399,8431 retained R39 main updates plus 16936 inherited are verified; active/worker-effective/whole-chain rates are 44.89k/38.90k/26.36k samples/s, with prior 3423.4 seconds of pauses excluded. The current pause is after that measurement endpoint. Capacity, smoke and diagnostic samples are excluded. Native target 8192, reserve 300 MiB and healthy-training ramps remain.\n\nNext focused tests:\n1. Preserve the useful R39 full learner, actor267 with every prior case passing, and separately certified actor349. The current 3.5 m/s direction gate and recurring lower-speed retention failures remain unresolved. Use the new actual per-command advantages, PPO mean-network gradients, teacher coverage and startup landing attribution to select one bounded retention-preserving continuation. The earlier fixed-frame candidate128 reduced drift but added real paired 2.5 m/s startup touchdowns at 0.90/0.94s; it remains rejected. Require independently seeded replication, unchanged full-state control at 64/128 updates, all matching prior/current gates and proper versioned provenance before deployment. Do not blindly repeat that kernel, relax startup gates or change arbitrary weights.\n2. Inspect the required head/shoulder/elbow angle, target and velocity timelines at every speed. The new 192-robot,20-second shoulder stiffness 35/50/70 test with damping 1 improves response, but no gain candidate has been learning-tested or deployed. At 3.5 m/s, stiffness 70 gives phases-